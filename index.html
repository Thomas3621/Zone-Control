<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ZoneAudio · iPad Console</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ZoneAudio — Professional iPad-first interface */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#08111f;
  --bg-2:#0d1728;
  --panel:rgba(18,27,46,.88);
  --panel-2:rgba(23,34,56,.94);
  --panel-3:rgba(10,18,32,.72);
  --line:rgba(148,163,184,.18);
  --line-strong:rgba(148,163,184,.28);
  --text:#eef4ff;
  --text-soft:#cbd5e1;
  --muted:#8ea0b8;
  --dim:#64748b;
  --accent:#60a5fa;
  --accent-2:#2563eb;
  --green:#22c55e;
  --amber:#f59e0b;
  --red:#ef4444;
  --shadow:0 20px 48px rgba(0,0,0,.30);
  --shadow-soft:0 10px 28px rgba(0,0,0,.22);
  --radius-lg:24px;
  --radius-md:18px;
  --app-pad:clamp(14px,1.7vw,24px);
  --gap:clamp(10px,1.2vw,16px);
}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;touch-action:manipulation}
body::before{content:'';position:fixed;inset:-25%;pointer-events:none;background:radial-gradient(circle at 16% 10%,rgba(96,165,250,.20),transparent 32%),radial-gradient(circle at 88% 18%,rgba(139,92,246,.16),transparent 30%),radial-gradient(circle at 55% 110%,rgba(34,197,94,.12),transparent 34%),linear-gradient(135deg,#07101d,#111a2e 48%,#0a1220);z-index:-2}
body::after{content:'';position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.55),transparent 75%);-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.55),transparent 75%);z-index:-1}
input,select,button,textarea{font-family:inherit;outline:none}
button,select,input[type=range],label{touch-action:manipulation}
button{border:0;user-select:none;-webkit-user-select:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(96,165,250,.42);outline-offset:2px}
.app{position:relative;display:flex;flex-direction:column;height:100vh;height:100dvh;min-height:100vh;overflow:hidden;padding:calc(env(safe-area-inset-top) + var(--app-pad)) calc(env(safe-area-inset-right) + var(--app-pad)) calc(env(safe-area-inset-bottom) + var(--app-pad)) calc(env(safe-area-inset-left) + var(--app-pad));gap:var(--gap)}

/* ── Header ── */
.hdr{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 16px 12px 20px;background:linear-gradient(180deg,rgba(24,36,60,.94),rgba(15,24,42,.92));border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);flex-shrink:0}
.hdr-l{display:flex;align-items:center;gap:12px;min-width:0;flex-shrink:0}
.hdr-logo{font-size:clamp(20px,2vw,26px);line-height:1;font-weight:800;color:var(--text);letter-spacing:-.7px;white-space:nowrap}
.hdr-dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px rgba(34,197,94,.12),0 0 18px rgba(34,197,94,.7);flex-shrink:0}
.hdr-lbl{font-size:12px;color:var(--muted);font-weight:650;letter-spacing:.2px;white-space:nowrap}
.hdr-r{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:0;flex-wrap:nowrap}
.hdr-time{min-width:72px;text-align:right;font-size:15px;color:var(--text-soft);font-weight:700;margin-right:2px;font-variant-numeric:tabular-nums}
.hb{height:44px;min-width:96px;padding:0 16px;border:1px solid var(--line);border-radius:15px;font-size:13px;font-weight:750;cursor:pointer;color:var(--text-soft);background:rgba(255,255,255,.055);letter-spacing:.1px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:transform .12s ease,background .12s ease,border-color .12s ease,color .12s ease,box-shadow .12s ease}
.hb:hover{background:rgba(255,255,255,.085);border-color:var(--line-strong)}
.hb:active{transform:scale(.97);background:rgba(255,255,255,.12)}
.hb.acc{color:#dbeafe;background:linear-gradient(180deg,rgba(59,130,246,.32),rgba(37,99,235,.18));border-color:rgba(96,165,250,.42);box-shadow:0 10px 24px rgba(37,99,235,.14),inset 0 1px 0 rgba(255,255,255,.10)}

/* ── Prayer ── */
.pray{position:relative;min-height:86px;display:grid;grid-template-columns:auto minmax(0,1fr) 1px auto 1px auto;align-items:center;gap:12px;padding:12px 14px;background:linear-gradient(180deg,rgba(21,32,54,.92),rgba(15,23,42,.90));border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft);flex-shrink:0;overflow:hidden;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.pray-locked::after{content:'';position:absolute;inset:0;background:rgba(8,17,31,.78);z-index:2;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);border-radius:inherit}
.lic-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;gap:12px;color:var(--text-soft)}
.lic-overlay .lt{font-size:13px;color:var(--text-soft);font-weight:800;letter-spacing:.5px}.lic-overlay .lb2{height:38px;padding:0 18px;border:1px solid rgba(96,165,250,.45);border-radius:13px;background:rgba(37,99,235,.22);color:#dbeafe;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 10px 24px rgba(37,99,235,.18)}
.pi2{font-size:28px;line-height:1;flex-shrink:0;filter:drop-shadow(0 4px 14px rgba(0,0,0,.28))}
#ptiles{display:grid!important;grid-template-columns:repeat(6,minmax(70px,1fr));gap:8px!important;align-items:stretch;min-width:0;overflow:hidden}
.ptile{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:58px;text-align:center;padding:9px 7px;border-radius:16px;flex-shrink:0;cursor:pointer;border:1px solid rgba(255,255,255,.065);background:rgba(255,255,255,.035);box-shadow:inset 0 1px 0 rgba(255,255,255,.04);transition:transform .12s ease,background .12s ease,border-color .12s ease,opacity .12s ease}
.ptile:active{transform:scale(.97);background:rgba(255,255,255,.08)}
.ptile.next{background:linear-gradient(180deg,rgba(245,158,11,.22),rgba(245,158,11,.10));border-color:rgba(245,158,11,.42);box-shadow:0 10px 24px rgba(245,158,11,.10),inset 0 1px 0 rgba(255,255,255,.08)}
.ptile.off{opacity:.36;filter:saturate(.6)}
.ptile .pn{font-size:10px;line-height:1.1;font-weight:800;color:var(--muted);letter-spacing:.55px;margin:0 0 5px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ptile .pt2{font-size:17px;line-height:1;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.25px}
.psep{width:1px;height:48px;background:linear-gradient(to bottom,transparent,var(--line-strong),transparent);flex-shrink:0}
.pnext{min-width:118px;padding:6px 10px;text-align:center;border-radius:16px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.16);flex-shrink:0}
.pnext .pnl{display:block;font-size:9px;font-weight:850;color:#fbbf24;letter-spacing:1.4px;margin-bottom:4px}
.pnext .pnn{font-size:18px;line-height:1.05;font-weight:850;color:#f59e0b;white-space:nowrap}
.pnext .pnc{font-size:12px;color:var(--muted);font-weight:650;margin-top:3px;font-variant-numeric:tabular-nums}
.pray-r{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-left:0;flex-shrink:0;min-width:0}
.pcf{height:38px;display:flex;align-items:center;gap:6px;padding:0 8px;border-radius:13px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.35px;white-space:nowrap}
.pcf input,.pcf select{height:28px;padding:0 7px;background:rgba(8,17,31,.64);border:1px solid var(--line);border-radius:9px;color:var(--text-soft);font-size:12px;font-weight:700;width:44px;min-width:44px}
.pcf select{width:auto;min-width:92px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 12px,calc(100% - 8px) 12px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:24px}
.sw{position:relative;width:54px;height:32px;cursor:pointer;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sw .sl{position:absolute;inset:0;background:rgba(148,163,184,.23);border:1px solid rgba(255,255,255,.08);border-radius:999px;transition:.2s;box-shadow:inset 0 1px 4px rgba(0,0,0,.22)}
.sw .sl::before{content:'';position:absolute;width:26px;height:26px;border-radius:50%;background:#f8fafc;left:2px;top:2px;transition:.2s;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.sw input:checked+.sl{background:linear-gradient(135deg,#16a34a,#22c55e);border-color:rgba(34,197,94,.55)}
.sw input:checked+.sl::before{transform:translateX(22px)}
.lic-badge{height:38px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:850;padding:0 12px;border-radius:13px;cursor:pointer;letter-spacing:.35px;flex-shrink:0;white-space:nowrap;transition:transform .12s ease,background .12s ease,border-color .12s ease}
.lic-badge:active{transform:scale(.97)}
.lic-badge.valid{color:#bbf7d0;background:rgba(34,197,94,.16);border:1px solid rgba(34,197,94,.35)}
.lic-badge.none{color:var(--muted);background:rgba(255,255,255,.045);border:1px solid var(--line)}
.lic-badge.expired{color:#fecaca;background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.34)}

/* ── Schedule Strip ── */
.sched{display:flex;align-items:center;gap:14px;padding:8px 16px;background:linear-gradient(180deg,rgba(21,32,54,.88),rgba(15,23,42,.86));border:1px solid var(--line);border-radius:18px;flex-shrink:0;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.sched-icon{font-size:18px;opacity:.7;flex-shrink:0}
.sched-group{display:flex;align-items:center;gap:8px;flex-shrink:0}
.sched-label{font-size:10px;font-weight:850;letter-spacing:1px;flex-shrink:0;white-space:nowrap}
.sched-label.start{color:#86efac}
.sched-label.stop{color:#fca5a5}
.sched-time{height:34px;padding:0 10px;background:rgba(8,17,31,.64);border:1px solid var(--line);border-radius:11px;color:var(--text-soft);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;min-width:0;width:90px}
.sched-time:focus{border-color:rgba(96,165,250,.55);box-shadow:0 0 0 3px rgba(96,165,250,.12)}
.sched-sw{position:relative;width:44px;height:26px;cursor:pointer;flex-shrink:0}
.sched-sw input{opacity:0;width:0;height:0}
.sched-sw .ssl{position:absolute;inset:0;background:rgba(148,163,184,.23);border:1px solid rgba(255,255,255,.08);border-radius:999px;transition:.2s}
.sched-sw .ssl::before{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#f8fafc;left:2px;top:2px;transition:.2s;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.sched-sw input:checked+.ssl{background:linear-gradient(135deg,#16a34a,#22c55e);border-color:rgba(34,197,94,.55)}
.sched-sw input:checked+.ssl::before{transform:translateX(18px)}
.sched-sep{width:1px;height:28px;background:linear-gradient(to bottom,transparent,var(--line-strong),transparent);flex-shrink:0}
.sched-status{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.3px;margin-left:auto;flex-shrink:0;white-space:nowrap}
.sched-status.active{color:#86efac}

/* ── Grid ── */
.zgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:var(--gap);padding:0;overflow:hidden}

/* ── Zone Card ── */
.zc{position:relative;min-height:0;max-height:100%;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,rgba(24,36,60,.92),rgba(13,22,39,.92));border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);isolation:isolate}
.zc::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.075),transparent 32%);pointer-events:none;z-index:-1}
.zc:active{box-shadow:0 22px 54px rgba(0,0,0,.36)}
.zc-bar{height:5px;flex-shrink:0;box-shadow:0 0 18px rgba(255,255,255,.08)}
.zc-body{padding:clamp(14px,1.7vw,20px);flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:clamp(10px,1.3vw,16px);min-height:0;overflow:hidden}
.zc-hdr{display:flex;align-items:center;gap:13px;min-height:0;flex-shrink:0}
.zc-ico{width:52px;height:52px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#fff;flex-shrink:0;box-shadow:0 14px 28px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.18)}
.zc-info{flex:1;min-width:0}
.zc-name{font-size:clamp(17px,1.85vw,22px);font-weight:850;color:var(--text);letter-spacing:-.45px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zc-stat{margin-top:5px;font-size:12px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:7px;letter-spacing:.7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zc-dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.zc-mode{height:42px;display:flex;align-items:center;gap:3px;background:rgba(8,17,31,.56);border:1px solid rgba(255,255,255,.075);border-radius:15px;padding:3px;flex-shrink:0;box-shadow:inset 0 1px 5px rgba(0,0,0,.20)}
.zc-mode button{height:34px;min-width:72px;padding:0 12px;border:none;border-radius:12px;font-size:11px;font-weight:850;cursor:pointer;color:var(--muted);background:transparent;letter-spacing:.65px;transition:background .12s ease,color .12s ease,transform .12s ease}
.zc-mode button:active{transform:scale(.97)}
.zc-mode button.on{background:linear-gradient(180deg,rgba(96,165,250,.23),rgba(37,99,235,.18));color:#dbeafe;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 20px rgba(37,99,235,.12)}
.zc-np{min-height:82px;background:rgba(8,17,31,.48);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:13px 15px;box-shadow:inset 0 1px 9px rgba(0,0,0,.18);flex-shrink:0}
.zc-song{font-size:15px;line-height:1.18;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;letter-spacing:-.15px}
.zc-trk{font-size:11px;color:var(--muted);font-weight:750;margin-bottom:9px;letter-spacing:.45px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zc-bar2{display:flex;align-items:center;gap:9px}
.zc-bar-bg{flex:1;height:6px;background:rgba(148,163,184,.18);border-radius:999px;overflow:hidden}
.zc-bar-fg{height:100%;border-radius:999px;transition:width .8s ease}
.zc-bar-t{font-size:11px;color:var(--muted);min-width:34px;font-weight:750;font-variant-numeric:tabular-nums}
.zc-ctrl{display:grid;grid-template-columns:1fr;gap:10px;flex-shrink:0}
.zc-btns{display:grid;grid-template-columns:repeat(6,minmax(38px,1fr));gap:8px;width:100%;flex-shrink:0}
.tb2{width:100%;height:46px;border:1px solid var(--line);border-radius:16px;font-size:18px;cursor:pointer;color:var(--text-soft);background:rgba(255,255,255,.055);display:flex;align-items:center;justify-content:center;transition:all .12s ease;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.tb2:hover{background:rgba(255,255,255,.085);border-color:var(--line-strong)}
.tb2:active{transform:scale(.95);background:rgba(255,255,255,.12)}
.tb2.play:active{color:#bbf7d0;border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.18)}
.tb2.pause:active{color:#fed7aa;border-color:rgba(245,158,11,.55);background:rgba(245,158,11,.18)}
.tb2.stop:active{color:#fecaca;border-color:rgba(239,68,68,.55);background:rgba(239,68,68,.18)}
.tb2.sk{font-size:14px}.tb2.sk:active{color:#bfdbfe;border-color:rgba(96,165,250,.55)}
.tb2.mt{font-size:16px}.tb2.mt.muted{background:rgba(239,68,68,.15);color:#fecaca;border-color:rgba(239,68,68,.35)}
.zc-vol{height:48px;display:flex;align-items:center;gap:12px;padding:0 12px 0 14px;background:rgba(8,17,31,.42);border:1px solid rgba(255,255,255,.07);border-radius:17px}
.zc-vol input[type=range]{flex:1;height:30px;cursor:pointer;appearance:none;-webkit-appearance:none;background:transparent;border-radius:999px;min-width:0}
.zc-vol input[type=range]::-webkit-slider-runnable-track{height:7px;background:rgba(148,163,184,.20);border-radius:999px}
.zc-vol input[type=range]::-moz-range-track{height:7px;background:rgba(148,163,184,.20);border-radius:999px}
.zc-vol input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:28px;height:28px;margin-top:-10.5px;border-radius:50%;background:#fff;border:5px solid rgba(96,165,250,.95);box-shadow:0 5px 14px rgba(0,0,0,.42);cursor:pointer}
.zc-vol input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:5px solid rgba(96,165,250,.95);box-shadow:0 5px 14px rgba(0,0,0,.42);cursor:pointer}
.zc-vol .vn{font-size:14px;font-weight:850;color:var(--text-soft);width:36px;text-align:right;font-variant-numeric:tabular-nums}

/* ── Footer ── */
.foot{min-height:42px;display:flex;align-items:center;justify-content:center;padding:0 16px;gap:18px;background:rgba(15,23,42,.68);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-soft);flex-shrink:0;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.foot-i{font-size:11px;color:var(--muted);letter-spacing:.9px;font-weight:800;white-space:nowrap}
.foot-s{font-size:11px;color:var(--text-soft);font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── License Modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(3,7,18,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:linear-gradient(180deg,rgba(24,36,60,.98),rgba(13,22,39,.98));border:1px solid var(--line);border-radius:26px;width:100%;max-width:440px;padding:30px 28px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal h2{font-size:22px;font-weight:850;text-align:center;color:var(--text);margin-bottom:6px;letter-spacing:-.4px}
.modal .msub{font-size:14px;color:var(--muted);text-align:center;margin-bottom:22px;font-weight:600}
.modal textarea{width:100%;padding:14px;background:rgba(8,17,31,.68);border:1px solid var(--line);border-radius:16px;color:var(--text-soft);font-size:14px;resize:none;height:92px;line-height:1.35}
.modal textarea:focus{border-color:rgba(96,165,250,.65);box-shadow:0 0 0 4px rgba(96,165,250,.12)}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.mb2{flex:1;height:46px;padding:0 12px;border:none;border-radius:15px;font-size:14px;font-weight:800;cursor:pointer;transition:transform .12s ease,background .12s ease}
.mb2:active{transform:scale(.97)}
.mb2.pri{background:linear-gradient(135deg,#2563eb,#60a5fa);color:#fff;box-shadow:0 12px 26px rgba(37,99,235,.25)}
.mb2.gho{background:rgba(255,255,255,.07);color:var(--text-soft);border:1px solid var(--line)}
.merr{color:#fca5a5;font-size:13px;font-weight:700;margin-top:10px}.mok{color:#86efac;font-size:13px;font-weight:700;margin-top:10px}
.minfo{margin-top:14px;padding:13px;background:rgba(8,17,31,.48);border-radius:16px;border:1px solid rgba(255,255,255,.07)}
.mrow{display:flex;justify-content:space-between;gap:16px;padding:6px 0;font-size:13px}
.mrow .ml{color:var(--muted);font-weight:650}.mrow .mv{font-weight:800;color:var(--text-soft);text-align:right}.mrow .mv.ok{color:#86efac}.mrow .mv.ex{color:#fca5a5}
.mrem{margin-top:12px;text-align:center}

<body>
<div id="conn" class="conn-s">Connecting…</div>
<div class="app" id="app" style="display:none">

  <div class="hdr">
    <div class="hdr-l"><span class="hdr-logo">ZoneAudio</span><span class="hdr-dot"></span><span class="hdr-lbl" id="st2"></span></div>
    <div class="hdr-r">
      <span class="hdr-time" id="clock"></span>
      <button class="hb acc" id="sbtn" onclick="syncDrive()">↻ Sync</button>
      <button class="hb" onclick="masterCmd('play')">▶ All Play</button>
      <button class="hb" onclick="masterCmd('pause')">⏸ Pause</button>
      <button class="hb" onclick="masterCmd('stop')">⏹ Stop</button>
    </div>
  </div>

  <div class="pray" id="pray-bar">
    <span class="pi2">🕌</span>
    <div id="ptiles" style="display:flex;gap:2px"></div>
    <div class="psep"></div>
    <div class="pnext"><span class="pnl">NEXT</span><div class="pnn" id="pn">—</div><div class="pnc" id="pc2"></div></div>
    <div class="psep"></div>
    <div class="pray-r">
      <div class="pcf">PRE<input type="number" id="pre" value="1" min="0" max="10" onchange="savePC()"></div>
      <div class="pcf">POST<input type="number" id="post" value="5" min="0" max="30" onchange="savePC()"></div>
      <div class="pcf"><select id="emir" onchange="fetchP()"><option>Dubai</option><option>Abu Dhabi</option><option>Sharjah</option><option>Ajman</option><option>Ras Al Khaimah</option><option>Fujairah</option></select></div>
      <label class="sw"><input type="checkbox" id="pm" checked onchange="savePC()"><span class="sl"></span></label>
      <div class="lic-badge none" id="lic-badge" onclick="showLM()">🔒 LICENSE</div>
    </div>
    <div class="lic-overlay" id="lic-lock"><span style="font-size:14px">🔒</span><span class="lt">PRAYER REQUIRES LICENSE</span><button class="lb2" onclick="showLM()">ACTIVATE</button></div>
  </div>

  <!-- SCHEDULE STRIP -->
  <div class="sched">
    <span class="sched-icon">🕐</span>
    <div class="sched-group">
      <span class="sched-label start">▶ START</span>

      <label class="sched-sw"><input type="checkbox" id="sched-start-on" onchange="saveSched()"><span class="ssl"></span></label>
    </div>
    <div class="sched-sep"></div>
    <div class="sched-group">
      <span class="sched-label stop">⏹ STOP</span>
      <input type="time" class="sched-time" id="sched-stop" value="22:00" onchange="saveSched()">
      <label class="sched-sw"><input type="checkbox" id="sched-stop-on" onchange="saveSched()"><span class="ssl"></span></label>
    </div>
    <span class="sched-status" id="sched-status">OFF</span>
  </div>

  <div class="zgrid" id="zgrid"></div>

  <div class="foot">
    <span class="foot-i">📂 LOCAL</span><span class="foot-i">☁️ DRIVE</span><span class="foot-i">🕌 PRAYER</span><span class="foot-i">🕐 SCHEDULE</span><span class="foot-i">📡 LIVE</span>
    <span class="foot-s" id="sync-t"></span>
  </div>
</div>

<div class="modal-bg" id="lic-modal" style="display:none" onclick="if(event.target===this)hideLM()">
  <div class="modal">
    <div style="font-size:24px;text-align:center;margin-bottom:6px">🕌</div>
    <h2>Prayer License</h2>
    <p class="msub">Enter yearly license key to activate</p>
    <textarea id="lic-input" placeholder="ZAPR-xxxxxxxx-xxxxxxxx-..."></textarea>
    <div class="modal-btns"><button class="mb2 gho" onclick="hideLM()">Cancel</button><button class="mb2 pri" onclick="actLic()">Activate</button></div>
    <p id="lic-err" class="merr" style="display:none"></p>
    <p id="lic-ok" class="mok" style="display:none"></p>
    <div class="minfo" id="lic-info" style="display:none">
      <div class="mrow"><span class="ml">Customer</span><span class="mv" id="li-c"></span></div>
      <div class="mrow"><span class="ml">Issued</span><span class="mv" id="li-i"></span></div>
      <div class="mrow"><span class="ml">Expires</span><span class="mv" id="li-e"></span></div>
      <div class="mrow"><span class="ml">Status</span><span class="mv" id="li-s"></span></div>
    </div>
    <div class="mrem" id="lic-rem" style="display:none"><button onclick="remLic()">Remove License</button></div>
  </div>
</div>

<script>
const FB={apiKey:"AIzaSyDgxVnFlhE5UtQws74QDdwsU2FFs9sxCVA",databaseURL:"https://audiocontroller-670a5-default-rtdb.firebaseio.com",projectId:"audiocontroller-670a5"};
const GK="AIzaSyA8km_ZwkkRGVInQq3opWjoHJWOGW8DI2E",GF="13KGisCtqNCWuulbARBN0ufF3M-6UdC85";
const IDS=[1,2,3,4],COL={1:'#ef4444',2:'#22c55e',3:'#eab308',4:'#8b5cf6'};
const NM=['Lobby','Main Hall','Conference A','Rooftop'];
const AX=['mp3','wav','ogg','flac','aac','m4a'];
const PRS=['Fajr','Dhuhr','Asr','Maghrib','Isha'],DSP=['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'];
const IC={Fajr:'🌅',Sunrise:'☀️',Dhuhr:'🌤',Asr:'⛅',Maghrib:'🌇',Isha:'🌙'};
let db,pt={},cfg={master:true,pre:1,post:5,en:{Fajr:1,Dhuhr:1,Asr:1,Maghrib:1,Isha:1}},muted=false,mT=null;
let licOK=false;const LS="ZoneAudio-Prayer-2026-SecretKey-CHANGE-THIS";
function fT(s){if(!s||!isFinite(s))return'0:00';const m=Math.floor(s/60),ss=Math.floor(s%60);return m+':'+(ss<10?'0':'')+ss}
setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})},1000);

// LICENSE
async function hm(k,m){const ck=await crypto.subtle.importKey('raw',new TextEncoder().encode(k),{name:'HMAC',hash:'SHA-256'},false,['sign']);const s=await crypto.subtle.sign('HMAC',ck,new TextEncoder().encode(m));return Array.from(new Uint8Array(s)).map(b=>b.toString(16).padStart(2,'0')).join('')}
async function vLic(key){try{let c=key.trim();if(c.startsWith('ZAPR-'))c=c.substring(5);c=c.replace(/-/g,'');const d=JSON.parse(atob(c));if(!d.product||!d.customer||!d.expires||!d.signature)return{ok:0,err:'Invalid format'};if(d.product!=='ZoneAudio-Prayer')return{ok:0,err:'Wrong product'};const msg=`${d.product}|${d.customer}|${d.issued}|${d.expires}|${d.maxDevices||10}`;const exp=await hm(LS,msg);if(exp!==d.signature)return{ok:0,err:'Invalid key'};const ex=new Date(d.expires+'T23:59:59');if(new Date()>ex)return{ok:0,err:'Expired',data:d,expired:1};return{ok:1,data:d,days:Math.ceil((ex-new Date())/864e5)}}catch(e){return{ok:0,err:'Bad key'}}}
async function chkLic(){const s=localStorage.getItem('za_lic');if(!s){sLic(0);return}const r=await vLic(s);if(r.ok){sLic(1,r)}else sLic(0,r)}
function sLic(ok,r){licOK=ok;const bar=document.getElementById('pray-bar'),lock=document.getElementById('lic-lock'),badge=document.getElementById('lic-badge');if(ok){bar.classList.remove('pray-locked');lock.style.display='none';badge.className='lic-badge valid';badge.textContent=`✓ ${r.days}d`}else{bar.classList.add('pray-locked');lock.style.display='flex';badge.className=r&&r.expired?'lic-badge expired':'lic-badge none';badge.textContent=r&&r.expired?'✗ EXPIRED':'🔒 LICENSE'}}
function showLM(){document.getElementById('lic-modal').style.display='flex';document.getElementById('lic-err').style.display='none';document.getElementById('lic-ok').style.display='none';const s=localStorage.getItem('za_lic');if(s){document.getElementById('lic-input').value=s;shLI()}}
function hideLM(){document.getElementById('lic-modal').style.display='none'}
async function actLic(){const k=document.getElementById('lic-input').value.trim(),err=document.getElementById('lic-err'),ok=document.getElementById('lic-ok');err.style.display='none';ok.style.display='none';if(!k){err.textContent='Enter a key';err.style.display='block';return}const r=await vLic(k);if(r.ok){localStorage.setItem('za_lic',k);ok.textContent=`✓ Activated! ${r.days} days left`;ok.style.display='block';sLic(1,r);shLD(r.data,r.days,1);fetchP()}else{err.textContent=r.err;err.style.display='block';if(r.data)shLD(r.data,0,0)}}
async function shLI(){const k=document.getElementById('lic-input').value.trim();if(!k)return;const r=await vLic(k);if(r.data)shLD(r.data,r.days||0,r.ok)}
function shLD(d,days,ok){document.getElementById('lic-info').style.display='block';document.getElementById('li-c').textContent=d.customer;document.getElementById('li-i').textContent=d.issued;document.getElementById('li-e').textContent=d.expires;const s=document.getElementById('li-s');s.textContent=ok?`ACTIVE · ${days}d`:'EXPIRED';s.className=ok?'mv ok':'mv ex';document.getElementById('lic-rem').style.display=ok?'block':'none'}
function remLic(){localStorage.removeItem('za_lic');sLic(0);document.getElementById('lic-info').style.display='none';document.getElementById('lic-input').value='';document.getElementById('lic-rem').style.display='none';document.getElementById('lic-err').textContent='Removed';document.getElementById('lic-err').style.display='block'}

// FIREBASE
firebase.initializeApp(FB);db=firebase.database();
db.ref('_ping').set(Date.now()).then(()=>{
  document.getElementById('conn').style.display='none';document.getElementById('app').style.display='flex';
  buildGrid();listen();loadPC();loadSched();chkLic().then(()=>{if(licOK)fetchP()});
  db.ref('sync/lastSync').on('value',s=>{const v=s.val();if(v)document.getElementById('sync-t').textContent='Sync: '+new Date(v).toLocaleTimeString()});
  setInterval(()=>{if(licOK)chkP()},15000);setInterval(()=>{if(licOK)updN()},5000);
  setInterval(chkSched,30000);
}).catch(e=>{document.getElementById('conn').textContent='✗ '+e.message});

// PRAYER
async function fetchP(){try{const r=await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${document.getElementById('emir').value}&country=United%20Arab%20Emirates&method=8`);const d=await r.json();if(d.code===200){pt=d.data.timings;bldPT();updN();db.ref('prayer/times').set(pt)}}catch(e){}}
function bldPT(){const c=document.getElementById('ptiles');c.innerHTML='';DSP.forEach(p=>{const t=pt[p]||'--:--';const isM=PRS.includes(p);const en=isM?cfg.en[p]:1;const d=document.createElement('div');d.className='ptile'+(en?'':' off');d.id='tp-'+p;d.innerHTML=`<div class="pn">${IC[p]} ${p.toUpperCase()}</div><div class="pt2">${t}</div>`;if(isM)d.onclick=()=>{cfg.en[p]=cfg.en[p]?0:1;savePC();bldPT();updN()};c.appendChild(d)})}
function updN(){const now=new Date();let nx=null,nn='',nt='';for(const p of PRS){if(!cfg.en[p])continue;const t=pt[p];if(!t)continue;const[h,m]=t.split(':').map(Number);const d=new Date(now);d.setHours(h,m,0,0);if(d>now&&(!nx||d<nx)){nx=d;nn=p;nt=t}}DSP.forEach(p=>{const el=document.getElementById('tp-'+p);if(el)el.classList.toggle('next',p===nn)});const ne=document.getElementById('pn'),nc=document.getElementById('pc2');if(muted){ne.textContent='🔇 MUTED';ne.style.color='#ef4444';nc.textContent='Prayer'}else if(nx){ne.textContent=nn;ne.style.color='#d97706';const df=Math.floor((nx-now)/1000);nc.textContent=`${Math.floor(df/3600)}h ${Math.floor((df%3600)/60)}m`}else{ne.textContent='—';ne.style.color='#94a3b8';nc.textContent=''}}
function chkP(){if(!cfg.master)return;const now=new Date();for(const p of PRS){if(!cfg.en[p])continue;const t=pt[p];if(!t)continue;const[h,m]=t.split(':').map(Number);const pd=new Date(now);pd.setHours(h,m,0,0);const mAt=new Date(pd.getTime()-(cfg.pre||1)*60000),uAt=new Date(pd.getTime()+(cfg.post||5)*60000);if(now>=mAt&&now<uAt&&!muted){muted=true;IDS.forEach(id=>db.ref(`players/${id}/command`).set({action:'mute',mute:true,ts:Date.now()}));updN();if(mT)clearTimeout(mT);mT=setTimeout(()=>{muted=false;IDS.forEach(id=>db.ref(`players/${id}/command`).set({action:'mute',mute:false,ts:Date.now()}));updN()},uAt-now)}}}
function savePC(){cfg.master=document.getElementById('pm').checked;cfg.pre=parseInt(document.getElementById('pre').value)||1;cfg.post=parseInt(document.getElementById('post').value)||5;localStorage.setItem('pc6',JSON.stringify(cfg));db.ref('prayer/config').set(cfg)}
function loadPC(){const s=localStorage.getItem('pc6');if(s)try{cfg=JSON.parse(s)}catch(e){}document.getElementById('pm').checked=cfg.master;document.getElementById('pre').value=cfg.pre||1;document.getElementById('post').value=cfg.post||5}

// SCHEDULE
let sched={startTime:'08:00',stopTime:'22:00',startOn:false,stopOn:false,startFired:'',stopFired:''};
function saveSched(){
  sched.startTime=document.getElementById('sched-start').value;
  sched.stopTime=document.getElementById('sched-stop').value;
  sched.startOn=document.getElementById('sched-start-on').checked;
  sched.stopOn=document.getElementById('sched-stop-on').checked;
  sched.startFired='';sched.stopFired='';
  localStorage.setItem('za_sched',JSON.stringify(sched));
  db.ref('schedule').set(sched);
  updSchedStatus();
}
function loadSched(){
  const s=localStorage.getItem('za_sched');
  if(s)try{sched=JSON.parse(s)}catch(e){}
  document.getElementById('sched-start').value=sched.startTime||'08:00';
  document.getElementById('sched-stop').value=sched.stopTime||'22:00';
  document.getElementById('sched-start-on').checked=!!sched.startOn;
  document.getElementById('sched-stop-on').checked=!!sched.stopOn;
  updSchedStatus();
}
function updSchedStatus(){
  const el=document.getElementById('sched-status');
  if(sched.startOn||sched.stopOn){
    let parts=[];
    if(sched.startOn)parts.push('▶'+sched.startTime);
    if(sched.stopOn)parts.push('⏹'+sched.stopTime);
    el.textContent=parts.join(' · ');
    el.className='sched-status active';
  }else{
    el.textContent='OFF';
    el.className='sched-status';
  }
}
function chkSched(){
  const now=new Date();
  const hhmm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const today=now.toDateString();
  // Auto START
  if(sched.startOn&&hhmm===sched.startTime&&sched.startFired!==today){
    sched.startFired=today;
    localStorage.setItem('za_sched',JSON.stringify(sched));
    console.log('Schedule: AUTO PLAY ALL at '+hhmm);
    masterCmd('play');
  }
  // Auto STOP
  if(sched.stopOn&&hhmm===sched.stopTime&&sched.stopFired!==today){
    sched.stopFired=today;
    localStorage.setItem('za_sched',JSON.stringify(sched));
    console.log('Schedule: AUTO STOP ALL at '+hhmm);
    masterCmd('stop');
  }
}

// SYNC
async function syncDrive(){const b=document.getElementById('sbtn');b.textContent='↻…';try{const r=await fetch(`https://www.googleapis.com/drive/v3/files?q='${GF}'+in+parents+and+trashed=false&key=${GK}&fields=files(id,name,size)&pageSize=500`);const d=await r.json();const sg=(d.files||[]).filter(f=>AX.includes((f.name.split('.').pop()||'').toLowerCase())).sort((a,c)=>a.name.localeCompare(c.name)).map((f,i)=>({id:f.id,name:f.name,size:parseInt(f.size)||0,index:i}));db.ref('playlist').set(sg);db.ref('sync/lastSync').set(Date.now());b.textContent=`✓ ${sg.length}`;setTimeout(()=>b.textContent='↻ Sync',2000)}catch(e){b.textContent='✗';setTimeout(()=>b.textContent='↻ Sync',2000)}}

// ZONES
function mkZ(id){const c=COL[id];return`<div class="zc">
<div class="zc-bar" style="background:${c}"></div>
<div class="zc-body">
  <div class="zc-hdr"><div class="zc-ico" style="background:${c}">${String(id).padStart(2,'0')}</div><div class="zc-info"><div class="zc-name">${NM[id-1]}</div><div class="zc-stat" id="ss-${id}"><span class="zc-dot" style="background:rgba(255,255,255,.15)"></span>OFFLINE</div></div><div class="zc-mode" id="cm-${id}"><button class="on" onclick="setSrc(${id},'local')">LOCAL</button><button onclick="setSrc(${id},'live')">LIVE</button></div></div>
  <div class="zc-np" id="np-${id}" style="display:none"><div class="zc-song" id="sn-${id}"></div><div class="zc-trk" id="tr-${id}"></div><div class="zc-bar2"><span class="zc-bar-t" id="ct-${id}">0:00</span><div class="zc-bar-bg"><div class="zc-bar-fg" id="pf-${id}" style="background:${c}"></div></div><span class="zc-bar-t" id="dt-${id}">0:00</span></div></div>
  <div class="zc-ctrl"><div class="zc-btns"><button class="tb2 sk" onclick="sendCmd(${id},'prev')">⏮</button><button class="tb2 play" onclick="sendCmd(${id},'play')">▶</button><button class="tb2 pause" onclick="sendCmd(${id},'pause')">⏸</button><button class="tb2 stop" onclick="sendCmd(${id},'stop')">⏹</button><button class="tb2 sk" onclick="sendCmd(${id},'next')">⏭</button><button class="tb2 mt" id="mu-${id}" onclick="togM(${id})">🔊</button></div><div class="zc-vol"><input type="range" min="0" max="100" value="70" id="vl-${id}" oninput="sendVol(${id},this.value)"><span class="vn" id="vv-${id}">70</span></div></div>
</div></div>`}
function buildGrid(){document.getElementById('zgrid').innerHTML=IDS.map(mkZ).join('')}

function listen(){IDS.forEach(id=>{db.ref(`players/${id}/status`).on('value',s=>{const st=s.val();if(!st)return;const el=document.getElementById(`ss-${id}`),on=st&&(Date.now()-st.ts<8000),ss=st?.st||'offline';if(el){const dc=on?(ss==='playing'||ss==='live'?'#22c55e':'#eab308'):'#cbd5e1';const gw=on&&(ss==='playing'||ss==='live')?'0 0 5px rgba(34,197,94,.3)':'none';el.innerHTML=`<span class="zc-dot" style="background:${dc};box-shadow:${gw}"></span>${(on?(st.muted?'🔇 ':'')+ss:'OFFLINE').toUpperCase()}`;el.style.color=on?(ss==='playing'||ss==='live'?'#22c55e':'#64748b'):'#94a3b8'}const np=document.getElementById(`np-${id}`);if(st.fn&&on){np.style.display='block';document.getElementById(`sn-${id}`).textContent=st.fn.replace(/\.[^/.]+$/,'');document.getElementById(`tr-${id}`).textContent=st.src==='live'?'LIVE':`${(st.idx||0)+1}/${st.total||0}`;document.getElementById(`ct-${id}`).textContent=fT(st.pos);document.getElementById(`dt-${id}`).textContent=fT(st.dur);if(st.dur>0)document.getElementById(`pf-${id}`).style.width=(st.pos/st.dur*100)+'%'}else np.style.display='none';const cm=document.getElementById(`cm-${id}`);if(cm&&st.src){cm.children[0].classList.toggle('on',st.src==='local');cm.children[1].classList.toggle('on',st.src==='live')}const mu=document.getElementById(`mu-${id}`);if(mu){mu.textContent=st.muted?'🔇':'🔊';mu.classList.toggle('muted',!!st.muted)}})})}
function sendCmd(id,a){db.ref(`players/${id}/command`).set({action:a,ts:Date.now()})}
function sendVol(id,v){document.getElementById(`vv-${id}`).textContent=v;db.ref(`players/${id}/command`).set({action:'volume',volume:v/100,ts:Date.now()})}
function setSrc(id,s){db.ref(`players/${id}/command`).set({action:'source',source:s,ts:Date.now()});const el=document.getElementById(`cm-${id}`);if(el){el.children[0].classList.toggle('on',s==='local');el.children[1].classList.toggle('on',s==='live')}}
async function togM(id){const s=await db.ref(`players/${id}/status`).get();const st=s.val();db.ref(`players/${id}/command`).set({action:'mute',mute:!(st?.muted),ts:Date.now()})}
function masterCmd(a){IDS.forEach(id=>db.ref(`players/${id}/command`).set({action:a,ts:Date.now()}))}
</script>
</body>
</html>
